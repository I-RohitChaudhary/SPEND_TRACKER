
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spend Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="brand">
            <div class="logo">₹</div>
            <div>
                <h1>Spend Tracker</h1>
                <p>Track your expenses. Stay in control.</p>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- ADD EXPENSE -->
        <section class="card">
            <h2>Add Expense</h2>

            <form id="expenseForm">
                <div class="form-grid">

                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount"
                               placeholder="Enter amount"
                               min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="">Select category</option>
                            <option>Food</option>
                            <option>Travel</option>
                            <option>Shopping</option>
                            <option>Bills</option>
                            <option>Entertainment</option>
                            <option>Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="note">Note</label>
                        <input type="text" id="note"
                               placeholder="Enter note (optional)"
                               maxlength="250">
                    </div>

                    <div class="form-group">
                        <label for="date">Date</label>
                        <input type="date" id="date" required>
                    </div>

                </div>

                <button type="submit" class="btn btn-green">
                    + Add Expense
                </button>
            </form>

            <p id="addMessage" class="message" aria-live="polite"></p>
        </section>


        <!-- GET EXPENSES + FILTERS -->
        <section class="card">
            <h2>Get Expenses</h2>

            <div class="filter-grid">

                <div class="form-group">
                    <label for="filterCategory">Category (optional)</label>
                    <select id="filterCategory">
                        <option value="">All Categories</option>
                        <option>Food</option>
                        <option>Travel</option>
                        <option>Shopping</option>
                        <option>Bills</option>
                        <option>Entertainment</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="startDate">From Date (optional)</label>
                    <input type="date" id="startDate">
                </div>

                <div class="form-group">
                    <label for="endDate">To Date (optional)</label>
                    <input type="date" id="endDate">
                </div>

                <button id="getExpensesBtn" class="btn btn-blue">
                    Get Expenses
                </button>

                <button id="getSummaryBtn" class="btn btn-purple">
                    Get Summary
                </button>

            </div>

            <p id="expenseMessage" class="message"
               aria-live="polite"></p>

            <!-- EXPENSE GRID -->
            <div id="expensesSection" class="result-section" hidden>
                <h3>Expenses List</h3>

                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Amount (₹)</th>
                                <th>Category</th>
                                <th>Note</th>
                                <th>Date</th>
                            </tr>
                        </thead>

                        <tbody id="expensesGrid"></tbody>
                    </table>
                </div>
            </div>
        </section>


        <!-- SUMMARY GRID -->
        <section id="summarySection" class="card" hidden>
            <h2>Spending Summary</h2>

            <div class="summary-cards">

                <div class="summary-card">
                    <p>Total Spend</p>
                    <h3 id="totalSpend">₹0</h3>
                </div>

                <div class="summary-card">
                    <p>Previous Month</p>
                    <h3 id="previousSpend">₹0</h3>
                </div>

                <div class="summary-card">
                    <p>MoM Change</p>
                    <h3 id="momChange">N/A</h3>
                </div>

            </div>

            <h3 class="category-heading">Spend by Category</h3>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Category</th>
                            <th>Amount (₹)</th>
                            <th>Percentage</th>
                        </tr>
                    </thead>

                    <tbody id="summaryGrid"></tbody>
                </table>
            </div>

            <p id="summaryMessage" class="message"
               aria-live="polite"></p>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
